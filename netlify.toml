[build]
  publish = "dist/astar/browser"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/.well-known/ard.json"
  to = "/well-known/ard.json"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "/well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ard.json"
  to = "/well-known/ard.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/well-known/ard.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/.well-known/ard.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/ard.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
