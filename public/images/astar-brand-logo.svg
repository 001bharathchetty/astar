      .brand-title { font-family: 'Jost', -apple-system, sans-serif; font-weight: 900; }
      .brand-sub { font-family: 'Jost', -apple-system, sans-serif; font-weight: 800; letter-spacing: 0.28em; }
    </style>
  </defs>
  <g transform="translate(500, 480)">
