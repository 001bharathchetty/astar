<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    
    <!-- Accent Red Radial Glow -->
    <radialGradient id="redGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ea1c24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#292524" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#redGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="5" fill="#ea1c24" />

  <!-- Content Container (Padding: Left 100, Top 90) -->
  <g transform="translate(100, 80)">
    
    <!-- Brand Header Lockup -->
    <g>
      <!-- Emblem Box -->
      <rect x="0" y="0" width="88" height="88" rx="22" fill="#000000" stroke="#44403c" stroke-width="2.5" />
      <!-- Bolt SVG Path -->
      <path d="M44 68 L40 46 L28 46 C25 46 26.5 43.5 27 42.5 L46 16 L49 16 L45 38 L57 38 C60 38 59.5 40.5 59 41.5 L44 68 Z" fill="#ea1c24" />

      <!-- Brand Typography -->
      <text x="110" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="-1">ASTAR</text>
      <text x="112" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" fill="#ea1c24" letter-spacing="5">ELECTRICALS</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="460" height="38" rx="19" fill="#292524" stroke="#44403c" stroke-width="1.2" />
      <circle cx="20" cy="19" r="5" fill="#ea1c24" />
      <text x="34" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="13" fill="#fafaf9" letter-spacing="2">COMMERCIAL ELECTRICAL CONTRACTING</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1.5">
      Electrical Expertise for
    </text>
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#ea1c24" letter-spacing="-1.5">
      Commercial Spaces.
    </text>

    <!-- Tagline & Description -->
    <text x="0" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#e7e5e4">
      Powering Quality. Built on Trust.
    </text>
    <text x="0" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#a8a29e">
      Electrical contracting aligned with project requirements, specifications, and construction schedules.
    </text>

    <!-- Footer Meta Row -->
    <g transform="translate(0, 440)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#292524" stroke-width="1.5" />
      
      <!-- Markets -->
      <text x="0" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="15" fill="#e7e5e4" letter-spacing="1">
        MARKETS: <tspan fill="#ea1c24">Bengaluru · Chennai · Hyderabad · South India</tspan>
      </text>

      <!-- Contact / Phone -->
      <text x="1000" y="35" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="15" fill="#a8a29e">
        +91 98800 57744 · astarelectricals.com
      </text>
    </g>

  </g>
</svg>
