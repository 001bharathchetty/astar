<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Warm Red Ambient Glow behind Logo -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ea1c24" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ea1c24" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Blueprint Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#centerGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Accent Bar (Brand Red) -->
  <rect x="0" y="0" width="1200" height="6" fill="#ea1c24" />

  <!-- Centered Content Structure (Guarantees WhatsApp 1:1 and 1.91:1 Visibility) -->
  <g text-anchor="middle">

    <!-- Official SVG Logo Emblem (Centered at x=600, y=55) -->
    <!-- Original viewBox is 25x24, scaled by 4.6 => width: 115px, height: 110px -->
    <!-- Center offset = 600 - (25 * 4.6 / 2) = 600 - 57.5 = 542.5 -->
    <g transform="translate(542.5, 55) scale(4.6)">
      <!-- Jost Sharp 'A' -->
      <path d="M 9.4,3.0 L 18.33,21.0 L 13.69,21.0 L 12.38,17.73 L 6.43,17.73 L 5.12,21.0 L 0.5,21.0 Z M 9.4,10.28 L 7.67,14.61 L 11.13,14.61 Z"
            fill="#ffffff" fill-rule="evenodd" />
      <!-- Electric Red Bolt -->
      <path d="M 20.6,3.0 L 19.75,9.95 L 24.1,9.95 L 18.35,21.0 L 19.15,13.95 L 15.0,13.95 Z"
            fill="#ea1c24" />
    </g>

    <!-- Brand Typography Lockup -->
    <!-- "AStar" in Jost 900 Black -->
    <text x="600" y="225"
          font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">
      AStar
    </text>

    <!-- "ELECTRICALS" in Jost Bold Red -->
    <text x="600" y="258"
          font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="18" fill="#ea1c24" letter-spacing="8">
      ELECTRICALS
    </text>

    <!-- Category Pill Badge -->
    <g transform="translate(370, 285)">
      <rect x="0" y="0" width="460" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="17" r="4.5" fill="#ea1c24" />
      <text x="240" y="22"
            font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace"
            font-weight="700" font-size="12" fill="#f8fafc" letter-spacing="2">
        COMMERCIAL ELECTRICAL CONTRACTING
      </text>
    </g>

    <!-- Main Headline -->
    <text x="600" y="375"
          font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.5">
      Electrical Contracting for Commercial Spaces
    </text>

    <!-- Tagline -->
    <text x="600" y="420"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="600" font-size="22" fill="#ea1c24">
      Powering Quality. Built on Trust.
    </text>

    <!-- Divider Line -->
    <line x1="300" y1="465" x2="900" y2="465" stroke="#334155" stroke-width="1" />

    <!-- Markets -->
    <text x="600" y="505"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace"
          font-weight="700" font-size="14.5" fill="#cbd5e1" letter-spacing="1">
      MARKETS: <tspan fill="#ea1c24">Bengaluru · Chennai · Hyderabad · South India</tspan>
    </text>

    <!-- Contact & Direct Desk -->
    <text x="600" y="542"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace"
          font-weight="700" font-size="14" fill="#94a3b8">
      Direct Contracting Desk: +91 98800 57744 · astarelectricals.com
    </text>

  </g>
</svg>