<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Warm Red Ambient Glow -->
    <radialGradient id="redGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ea1c24" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Blueprint Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.7" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#redGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#ea1c24" />

  <!-- Main Content Container -->
  <g transform="translate(100, 75)">

    <!-- Brand Header Lockup -->
    <g>
      <!-- Official SVG Emblem -->
      <g transform="translate(0, 0) scale(4)">
        <!-- Jost Sharp 'A' -->
        <path d="M 9.4,3.0 L 18.33,21.0 L 13.69,21.0 L 12.38,17.73 L 6.43,17.73 L 5.12,21.0 L 0.5,21.0 Z M 9.4,10.28 L 7.67,14.61 L 11.13,14.61 Z" fill="#ffffff" fill-rule="evenodd" />
        <!-- Electric Red Bolt -->
        <path d="M 20.6,3.0 L 19.75,9.95 L 24.1,9.95 L 18.35,21.0 L 19.15,13.95 L 15.0,13.95 Z" fill="#ea1c24" />
      </g>

      <!-- Brand Typography -->
      <text x="125" y="58" font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1">AStar</text>
      <text x="128" y="88" font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#ea1c24" letter-spacing="6">ELECTRICALS</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="460" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="18" cy="18" r="5" fill="#ea1c24" />
      <text x="32" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-weight="700" font-size="12" fill="#f8fafc" letter-spacing="2">COMMERCIAL ELECTRICAL CONTRACTING</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="255" font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-1.5">
      Electrical Expertise for
    </text>
    <text x="0" y="320" font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="54" fill="#ea1c24" letter-spacing="-1.5">
      Commercial Spaces.
    </text>

    <!-- Tagline & Description -->
    <text x="0" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" fill="#f1f5f9">
      Powering Quality. Built on Trust.
    </text>
    <text x="0" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      High-grade commercial electrical installations, LT panels, containment &amp; infrastructure.
    </text>

    <!-- Footer Meta Row -->
    <g transform="translate(0, 455)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1" />
      
      <!-- Markets -->
      <text x="0" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-weight="700" font-size="14" fill="#cbd5e1" letter-spacing="1">
        MARKETS: <tspan fill="#ea1c24">Bengaluru · Chennai · Hyderabad · South India</tspan>
      </text>

      <!-- Contact / Phone -->
      <text x="1000" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-weight="700" font-size="14" fill="#94a3b8">
        +91 98800 57744 · astarelectricals.com
      </text>
    </g>

  </g>
</svg>