<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
      }
      .brand-sub {
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  
  <!-- Top Accent Bar (Brand Red) -->
  <rect x="0" y="0" width="1200" height="6" fill="#ea1c24" />

  <!-- Centered Bold Logo Lockup -->
  <g transform="translate(600, 325)">
    <!-- AStar Official Emblem (Unchopped, Balanced) -->
    <g transform="translate(-130, -250) scale(0.207)">
      <path d="M 300 163 L 374 163 L 476 462 L 382 462 L 366 409 L 227 409 L 193 462 L 100 462 Z M 337 250 L 353 350 L 264 350 Z" fill="#0F172A" fill-rule="evenodd" />
      <path d="M 808 37 L 364 736 L 657 736 L 474 1230 L 1002 577 L 691 577 Z" fill="#EA1C24" />
      <path d="M 830 874 L 1069 874 L 1050 942 L 908 942 L 896 986 L 1014 986 L 996 1050 L 878 1050 L 866 1094 L 1022 1094 L 1004 1159 L 748 1159 Z" fill="#0F172A" />
    </g>

    <!-- Brand Typography Lockup: A in Midnight Blue, STAR in Electric Red, ELECTRICALS in Midnight Blue -->
    <text x="0" y="90"
          text-anchor="middle"
          class="brand-title"
          font-size="114"
          fill="#0F172A"
          letter-spacing="-2">
      A<tspan fill="#EA1C24">STAR</tspan>
    </text>

    <text x="0" y="148"
          text-anchor="middle"
          class="brand-sub"
          font-size="33"
          fill="#0F172A">
      ELECTRICALS
    </text>
  </g>
</svg>