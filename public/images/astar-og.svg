<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
      }
      .brand-sub {
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: 0.28em;
      }
    </style>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  
  <!-- Top Accent Bar (Brand Red) -->
  <rect x="0" y="0" width="1200" height="6" fill="#ea1c24" />

  <!-- Centered Bold Logo Lockup (+50% larger, fills safe-zone with minimal excess whitespace) -->
  <g transform="translate(600, 335)">

    <!-- Official Emblem (Scaled 10.5x = +50% over scale 7) -->
    <!-- ViewBox: 25x24 * 10.5 => width: 262.5px, height: 252px -->
    <!-- Center offset x: -131.25, y: -230 -->
    <g transform="translate(-131.25, -230) scale(10.5)">
      <!-- Midnight Blue "A" -->
      <path d="M 9.4,3.0 L 18.33,21.0 L 13.69,21.0 L 12.38,17.73 L 6.43,17.73 L 5.12,21.0 L 0.5,21.0 Z M 9.4,10.28 L 7.67,14.61 L 11.13,14.61 Z"
            fill="#0F172A" fill-rule="evenodd" />
      <!-- Electric Red Bolt -->
      <path d="M 20.6,3.0 L 19.75,9.95 L 24.1,9.95 L 18.35,21.0 L 19.15,13.95 L 15.0,13.95 Z"
            fill="#EA1C24" />
    </g>

    <!-- Brand Typography Lockup (+50% larger) -->
    <!-- "AStar" in Jost 900 Black (114px, was 76px) -->
    <text x="0" y="110"
          text-anchor="middle"
          class="brand-title"
          font-size="114"
          fill="#0F172A"
          letter-spacing="-2">
      AStar
    </text>

    <!-- "ELECTRICALS" in Jost Bold Red (33px, was 22px) -->
    <text x="0" y="168"
          text-anchor="middle"
          class="brand-sub"
          font-size="33"
          fill="#EA1C24">
      ELECTRICALS
    </text>

  </g>
</svg>