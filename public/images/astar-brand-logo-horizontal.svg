<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@700;800;900&amp;display=swap');
      .brand-title { font-family: 'Jost', -apple-system, sans-serif; font-weight: 900; }
      .brand-sub { font-family: 'Jost', -apple-system, sans-serif; font-weight: 800; letter-spacing: 0.24em; }
    </style>
  </defs>
  <g transform="translate(100, 200)">
    <!-- AStar Official Emblem (Unchopped, Balanced) -->
    <g transform="translate(0, -100) scale(0.16)">
      <path d="M 300 163 L 374 163 L 476 462 L 382 462 L 366 409 L 227 409 L 193 462 L 100 462 Z M 337 250 L 353 350 L 264 350 Z" fill="#0F172A" fill-rule="evenodd" />
      <path d="M 808 37 L 364 736 L 657 736 L 474 1230 L 1002 577 L 691 577 Z" fill="#EA1C24" />
      <path d="M 830 874 L 1069 874 L 1050 942 L 908 942 L 896 986 L 1014 986 L 996 1050 L 878 1050 L 866 1094 L 1022 1094 L 1004 1159 L 748 1159 Z" fill="#0F172A" />
    </g>
    <!-- Brand Wordmark: A in Midnight Blue, STAR in Electric Red, ELECTRICALS in Midnight Blue -->
    <g transform="translate(240, 0)">
      <text x="0" y="16" class="brand-title" font-size="115" fill="#0F172A" letter-spacing="-3">A<tspan fill="#EA1C24">STAR</tspan></text>
      <text x="0" y="70" class="brand-sub" font-size="32" fill="#0F172A">ELECTRICALS</text>
    </g>
  </g>
</svg>
