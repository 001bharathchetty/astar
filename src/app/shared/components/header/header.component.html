<!-- Sticky Navigation Header with Dark & Light theme support -->
<header class="sticky top-0 z-40 w-full bg-stone-50/95 dark:bg-stone-950/95 backdrop-blur-md border-b border-stone-200 dark:border-stone-800 transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Brand Identity (Red, Black, White + Big Bad Blunt Bold Font) -->
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="flex items-center gap-2.5 sm:gap-3.5 group focus:outline-none focus:ring-2 focus:ring-[#ea1c24] rounded-xl p-1 shrink-0"
      aria-label="AStar Electricals — Home"
    >
      <!-- AStar Official Emblem: Slanted A & E with Lightning Bolt (Balanced, Unchopped) -->
      <div class="h-10 sm:h-11 flex items-center justify-center p-0.5 group-hover:scale-105 transition-all shrink-0">
        <svg class="w-9 h-9 sm:w-10 sm:h-10" viewBox="0 0 1254 1254" fill="none" aria-hidden="true">
          <path d="M 300 163 L 374 163 L 476 462 L 382 462 L 366 409 L 227 409 L 193 462 L 100 462 Z M 337 250 L 353 350 L 264 350 Z" class="fill-[#0F172A] dark:fill-white" fill-rule="evenodd" />
          <path d="M 808 37 L 364 736 L 657 736 L 474 1230 L 1002 577 L 691 577 Z" fill="#EA1C24" />
          <path d="M 830 874 L 1069 874 L 1050 942 L 908 942 L 896 986 L 1014 986 L 996 1050 L 878 1050 L 866 1094 L 1022 1094 L 1004 1159 L 748 1159 Z" class="fill-[#0F172A] dark:fill-white" />
        </svg>
      </div>

      <div class="flex flex-col justify-center leading-none">
        <span class="font-brand font-black text-lg sm:text-2xl tracking-tight leading-none text-stone-950 dark:text-white">
          A<span class="text-[#ea1c24]">STAR</span>
        </span>
        <span class="text-[9px] sm:text-[11px] font-bold tracking-[0.22em] uppercase text-stone-900 dark:text-stone-100 leading-none font-brand mt-1">
          ELECTRICALS
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Links with Active Highlighting -->
    <nav class="hidden lg:flex items-center gap-5 xl:gap-7 2xl:gap-8" aria-label="Primary Navigation">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="text-stone-950 dark:text-white font-bold border-b-2 border-[#ea1c24]"
        class="text-sm lg:text-[15px] xl:text-base font-semibold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Home
      </a>
      <a
        routerLink="/about"
        routerLinkActive="text-stone-950 dark:text-white font-bold border-b-2 border-[#ea1c24]"
        class="text-sm lg:text-[15px] xl:text-base font-semibold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        About
      </a>
      <a
        routerLink="/services"
        routerLinkActive="text-stone-950 dark:text-white font-bold border-b-2 border-[#ea1c24]"
        class="text-sm lg:text-[15px] xl:text-base font-semibold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Services
      </a>
      <a
        routerLink="/safety-quality"
        routerLinkActive="text-stone-950 dark:text-white font-bold border-b-2 border-[#ea1c24]"
        class="text-sm lg:text-[15px] xl:text-base font-semibold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Safety & Quality
      </a>
      <a
        routerLink="/projects"
        routerLinkActive="text-stone-950 dark:text-white font-bold border-b-2 border-[#ea1c24]"
        class="text-sm lg:text-[15px] xl:text-base font-semibold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Projects
      </a>
    </nav>

    <!-- Action Bar (Theme, Call & Contact CTA) -->
    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
      <!-- Dark / Light Theme Toggle -->
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        [title]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white hover:bg-stone-200/70 dark:hover:bg-stone-800/70 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ea1c24] leading-none shrink-0"
      >
        @if (themeService.isDark()) {
          <!-- Sun icon when in dark mode (click to switch to light mode) -->
          <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Crescent Moon icon when in light mode (click to switch to dark mode) -->
          <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
        }
      </button>

      <!-- Direct Phone Call Link (Sleek Icon Button, Accessible on all viewports) -->
      <a
        [href]="'tel:' + content.brand.phoneRaw"
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-stone-700 dark:text-stone-300 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] hover:bg-stone-200/70 dark:hover:bg-stone-800/70 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ea1c24] leading-none shrink-0"
        [attr.aria-label]="'Call AStar Electricals: ' + content.brand.phone"
        [title]="'Call AStar: ' + content.brand.phone"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </a>

      <!-- Primary CTA: Contact Button (hidden on narrow screens < sm, fully accessible in drawer & desktop) -->
      <a
        routerLink="/contact"
        class="hidden sm:inline-flex h-9 sm:h-10 px-4 sm:px-5 rounded-full items-center justify-center bg-[#ea1c24] hover:bg-[#b91c1c] text-white font-semibold text-xs sm:text-sm shadow-md hover:shadow-lg transition-all whitespace-nowrap focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#ea1c24] leading-none shrink-0"
        aria-label="Contact AStar Electricals"
      >
        Contact
      </a>

      <!-- Mobile Hamburger / Close Toggle (Always cleanly inside the screen) -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="lg:hidden w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-stone-800 dark:text-stone-200 hover:bg-stone-200/70 dark:hover:bg-stone-800/70 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ea1c24] leading-none shrink-0"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      >
        @if (mobileMenuOpen()) {
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        } @else {
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        }
      </button>
    </div>

  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div id="mobile-menu" class="lg:hidden bg-stone-50 dark:bg-stone-950 border-b border-stone-200 dark:border-stone-800 px-4 sm:px-6 py-6 space-y-4 animate-in slide-in-from-top duration-200 shadow-xl" role="region" aria-label="Mobile Navigation Menu">
      <nav class="flex flex-col space-y-1" aria-label="Mobile Navigation">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 border-b border-stone-200/60 dark:border-stone-800/60 flex items-center justify-between transition-colors"
        >
          <span>Home</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
        <a
          routerLink="/about"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 border-b border-stone-200/60 dark:border-stone-800/60 flex items-center justify-between transition-colors"
        >
          <span>About AStar</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
        <a
          routerLink="/services"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 border-b border-stone-200/60 dark:border-stone-800/60 flex items-center justify-between transition-colors"
        >
          <span>Commercial Services</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
        <a
          routerLink="/safety-quality"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 border-b border-stone-200/60 dark:border-stone-800/60 flex items-center justify-between transition-colors"
        >
          <span>Safety & Quality</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
        <a
          routerLink="/projects"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 border-b border-stone-200/60 dark:border-stone-800/60 flex items-center justify-between transition-colors"
        >
          <span>Commercial Projects</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-[#ea1c24] dark:text-[#ea1c24] font-black"
          (click)="closeMobileMenu()"
          class="text-base sm:text-lg font-bold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] dark:hover:text-[#ea1c24] py-2.5 flex items-center justify-between transition-colors"
        >
          <span>Contact & Inquiries</span>
          <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
      </nav>

      <div class="pt-4 border-t border-stone-200 dark:border-stone-800 flex flex-col gap-3">
        <a
          [href]="'tel:' + content.brand.phoneRaw"
          class="text-sm font-semibold text-stone-900 dark:text-white flex items-center gap-3 py-1"
        >
          <span class="w-8 h-8 rounded-full bg-stone-200/80 dark:bg-stone-800 flex items-center justify-center text-[#ea1c24] shrink-0 leading-none">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
            </svg>
          </span>
          <span class="font-medium text-stone-800 dark:text-stone-200">{{ content.brand.phone }}</span>
        </a>
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          class="w-full h-11 bg-[#ea1c24] hover:bg-[#b91c1c] text-white font-semibold rounded-full shadow-md flex items-center justify-center transition leading-none text-sm"
        >
          Contact
        </a>
      </div>
    </div>
  }
</header>
