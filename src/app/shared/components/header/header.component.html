<!-- Sticky Navigation Header with Dark & Light theme support -->
<header class="sticky top-0 z-40 w-full bg-stone-50/95 dark:bg-stone-950/95 backdrop-blur-md border-b border-stone-200 dark:border-stone-800 transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Brand Identity (Red, Black, White + Big Bad Blunt Bold Font) -->
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="flex items-center gap-3.5 group focus:outline-none focus:ring-2 focus:ring-[#ea1c24] rounded-xl p-1"
      aria-label="AStar Electricals — Home"
    >
      <!-- Distinctive Industrial Emblem (Black box, Red Bolt, White border) -->
      <div class="w-11 h-11 rounded-xl bg-black border-2 border-stone-800 dark:border-stone-700 flex items-center justify-center text-white shadow-md group-hover:border-[#ea1c24] group-hover:scale-105 transition-all">
        <mat-icon class="!text-[#ea1c24] !text-2xl !w-6 !h-6 leading-none">bolt</mat-icon>
      </div>

      <div class="flex flex-col justify-center leading-none">
        <span class="font-brand font-black text-xl sm:text-2xl tracking-tight text-stone-950 dark:text-white leading-none">
          AStar
        </span>
        <span class="text-[10px] sm:text-[11px] font-bold tracking-[0.22em] uppercase text-[#ea1c24] leading-none font-heading mt-1">
          Electricals
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Links with Active Highlighting -->
    <nav class="hidden lg:flex items-center gap-4 xl:gap-6 2xl:gap-8" aria-label="Primary Navigation">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Home
      </a>
      <a
        routerLink="/about"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        About
      </a>
      <a
        routerLink="/services"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Services
      </a>
      <a
        routerLink="/safety-quality"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Safety & Quality
      </a>
      <a
        routerLink="/projects"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Projects
      </a>
      <a
        routerLink="/contact"
        routerLinkActive="text-stone-950 dark:text-white font-extrabold border-b-2 border-[#ea1c24]"
        class="text-xs xl:text-sm font-bold text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white pb-1 transition whitespace-nowrap"
      >
        Contact
      </a>
    </nav>

    <!-- Action Bar (Theme, Call & Discuss Project CTA) -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Dark / Light Theme Toggle -->
      <button
        type="button"
        mat-icon-button
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        class="!w-10 !h-10 text-stone-700 dark:text-stone-300 hover:text-stone-950 dark:hover:text-white rounded-full transition-colors flex items-center justify-center"
      >
        @if (themeService.isDark()) {
          <!-- Sun icon when in dark mode (click to switch to light mode) -->
          <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Crescent Moon icon when in light mode (click to switch to dark mode) -->
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
        }
      </button>

      <!-- Direct Phone Call Link -->
      <a
        [href]="'tel:' + content.brand.phoneRaw"
        mat-stroked-button
        class="hidden sm:inline-flex !border-stone-300 dark:!border-stone-700 !text-stone-800 dark:!text-stone-200 hover:!bg-stone-200 dark:hover:!bg-stone-800 !rounded-full !font-bold text-xs !px-3.5 !py-2 items-center gap-1.5 transition"
        [attr.aria-label]="'Call ' + content.brand.phone"
      >
        <mat-icon class="!w-4 !h-4 !text-base leading-none text-[#ea1c24]">call</mat-icon>
        <span class="font-mono">{{ content.brand.phone }}</span>
      </a>

      <!-- Primary CTA: Discuss a Project -->
      <button
        type="button"
        (click)="openInquiryDialog()"
        mat-flat-button
        class="!bg-[#ea1c24] hover:!bg-[#b91c1c] !text-white !rounded-full !font-semibold text-xs sm:text-sm !px-5 !py-2.5 shadow-md transition whitespace-nowrap"
        aria-label="Open project inquiry dialog"
      >
        Discuss a Project
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button
        type="button"
        mat-icon-button
        (click)="toggleMobileMenu()"
        class="lg:hidden text-stone-800 dark:text-stone-200 focus:outline-none"
        [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      >
        <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>

  </div>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="lg:hidden bg-stone-50 dark:bg-stone-950 border-b border-stone-200 dark:border-stone-800 px-6 py-6 space-y-4 animate-in slide-in-from-top duration-200">
      <nav class="flex flex-col space-y-3" aria-label="Mobile Navigation">
        <a
          routerLink="/"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1 border-b border-stone-200/60 dark:border-stone-800/60"
        >
          Home
        </a>
        <a
          routerLink="/about"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1 border-b border-stone-200/60 dark:border-stone-800/60"
        >
          About AStar
        </a>
        <a
          routerLink="/services"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1 border-b border-stone-200/60 dark:border-stone-800/60"
        >
          Commercial Services
        </a>
        <a
          routerLink="/safety-quality"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1 border-b border-stone-200/60 dark:border-stone-800/60"
        >
          Safety & Quality
        </a>
        <a
          routerLink="/projects"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1 border-b border-stone-200/60 dark:border-stone-800/60"
        >
          Commercial Projects
        </a>
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          class="text-base font-extrabold text-stone-900 dark:text-stone-100 hover:text-[#ea1c24] py-1"
        >
          Contact & Inquiries
        </a>
      </nav>

      <div class="pt-4 border-t border-stone-200 dark:border-stone-800 flex flex-col gap-3">
        <a
          [href]="'tel:' + content.brand.phoneRaw"
          class="text-sm font-bold text-stone-900 dark:text-white flex items-center gap-2"
        >
          <mat-icon class="!w-4 !h-4 !text-base leading-none text-[#ea1c24]">call</mat-icon>
          <span>{{ content.brand.phone }}</span>
        </a>
        <button
          type="button"
          (click)="openInquiryDialog()"
          mat-flat-button
          class="w-full !bg-[#ea1c24] !text-white !font-semibold !py-3 !rounded-full shadow-md"
        >
          Discuss a Project
        </button>
      </div>
    </div>
  }
</header>
