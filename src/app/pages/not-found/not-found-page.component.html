<div class="min-h-[75vh] flex items-center justify-center py-16 sm:py-24 px-4 sm:px-6 lg:px-8">
  <div class="max-w-xl w-full text-center space-y-6">
    
    <div class="w-16 h-16 rounded-2xl bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-700 flex items-center justify-center mx-auto shadow-sm transition-all duration-300 hover:scale-110 hover:text-[#ea1c24] hover:border-[#ea1c24]/30">
      <mat-icon class="!text-3xl leading-none">power_off</mat-icon>
    </div>

    <span class="text-xs font-mono font-bold uppercase tracking-widest text-[#ea1c24] block">
      Error 404 — Circuit Disconnected
    </span>

    <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold font-heading text-stone-900 dark:text-white tracking-tight">
      Page Not Found
    </h1>

    <div class="space-y-3">
      <p class="text-sm sm:text-base text-stone-600 dark:text-stone-300 leading-relaxed max-w-lg mx-auto">
        The commercial contracting page or resource you are looking for does not exist or has been moved.
      </p>

      <!-- Attempted Path Badge -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-stone-200/80 dark:bg-stone-800/80 border border-stone-300/60 dark:border-stone-700/60 text-xs font-mono text-stone-700 dark:text-stone-300 max-w-full overflow-hidden">
        <span class="text-stone-500 dark:text-stone-400">Route:</span>
        <code class="font-bold text-[#ea1c24] truncate select-all">{{ attemptedPath() }}</code>
      </div>
    </div>

    <!-- Navigation & Issue Reporting Action Cluster -->
    <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
      <!-- Return to Home -->
      <a
        routerLink="/"
        mat-flat-button
        class="!bg-[#ea1c24] hover:!bg-[#b91c1c] !text-white !font-semibold !px-6 !py-3.5 !rounded-full text-sm shadow-md transition w-full sm:w-auto"
      >
        Return to Home &rarr;
      </a>

      <!-- View Capabilities -->
      <a
        routerLink="/services"
        mat-stroked-button
        class="!border-stone-300 dark:!border-stone-700 !text-stone-900 dark:!text-stone-100 !font-semibold !px-6 !py-3.5 !rounded-full text-sm transition w-full sm:w-auto"
      >
        View Capabilities
      </a>

      <!-- Report Issue / Broken Link (Prefilled Contact Form) -->
      <a
        routerLink="/contact"
        [queryParams]="contactQueryParams"
        mat-stroked-button
        class="!border-stone-300 dark:!border-stone-700 hover:!border-[#ea1c24] !text-stone-700 dark:!text-stone-300 hover:!text-[#ea1c24] !font-medium !px-5 !py-3.5 !rounded-full text-sm transition flex items-center justify-center gap-2 w-full sm:w-auto"
        title="Open contact form with this route prefilled to report a broken link"
      >
        <mat-icon class="!w-4 !h-4 !text-base leading-none text-[#ea1c24]">flag</mat-icon>
        <span>Report Broken Link</span>
      </a>

      <!-- 1-Click Instant Quick Report Button -->
      <button
        type="button"
        (click)="reportQuickly()"
        [disabled]="isReporting() || reported()"
        mat-button
        class="!text-stone-500 hover:!text-stone-800 dark:!text-stone-400 dark:hover:!text-stone-200 !font-medium text-xs sm:text-sm !px-4 !py-3 transition flex items-center justify-center gap-1.5 disabled:opacity-50 w-full sm:w-auto cursor-pointer"
        [title]="reported() ? 'Report registered' : 'Instantly notify our team about this missing link'"
      >
        <mat-icon class="!w-4 !h-4 !text-[15px] leading-none text-[#ea1c24]">
          {{ reported() ? 'check_circle' : (isReporting() ? 'sync' : 'bolt') }}
        </mat-icon>
        <span>{{ reported() ? 'Report Logged ✓' : (isReporting() ? 'Logging...' : '1-Click Report') }}</span>
      </button>
    </div>

  </div>
</div>
